# Build + publish a release on every v* tag.
#
# GitHub only accepts workflow files from a token with the `workflow` scope.
# To turn this on for the repo:
#     gh auth refresh -s workflow
#     git mv ci/release.yml .github/workflows/release.yml
#     git commit -m 'enable CI releases' && git push
# Until then, publish a release locally with `./release.sh`.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # arm64 runner: the .app embeds an arm64 Python + MediaPipe wheels
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run headless checks
        run: |
          python tests/test_math.py
          python tests/test_updater.py
          python tests/test_gestures.py

      - name: Build .app, .zip and .dmg
        env:
          PYTHON: python
        run: ./build.sh

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AirTouch.zip
            dist/AirTouch.dmg
          generate_release_notes: true

      - name: Keep the artefacts even without a tag
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: AirTouch-app
          path: |
            dist/AirTouch.zip
            dist/AirTouch.dmg
